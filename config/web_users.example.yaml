# Template for config/web_users.yaml — copy it and fill in your own hashes:
#
#   cp config/web_users.example.yaml config/web_users.yaml
#
# The real file is gitignored: it holds password hashes, which do not belong in the repo.
#
# Roles:
#   admin    → full access + score overrides
#   analyst  → full access (fetch, run QA, edit rules)
#   viewer   → read-only (browse, overview, export)
#
# Passwords are bcrypt-hashed (rounds=12). To generate a hash:
#   .venv/bin/python -c "from intercom_summary.web.auth import hash_password; print(hash_password('your-password'))"
#
# Then ./restart.sh to pick up the change.

users:
  admin:
    password_hash: "$2b$12$REPLACE_ME_WITH_A_REAL_BCRYPT_HASH......................"
    role: admin
